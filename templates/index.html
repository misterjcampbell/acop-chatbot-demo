<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ACOP Booking Assistant</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<button id="chat-toggle">Chat</button>

<div id="chat-popup">
  <div id="chat-header">
    <div><strong>ACOP Booking Assistant</strong><br><small>Usually replies in seconds</small></div>
    <button id="close-chat">×</button>
  </div>

  <div id="chat-box">
    <div class="msg bot">Hi! I'm here to help you book your assessment call.\n\nWhat's your name?</div>
  </div>

  <div id="chat-input">
    <input type="text" id="txt" placeholder="Type a message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>
</div>

<script src="/static/script.js" defer></script>
</body>
</html>
