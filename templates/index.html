<!DOCTYPE html>
<html>
<head>
    <title>ACOP Booking Assistant</title>
    <link rel="stylesheet" href="/static/chat-messenger.css">
</head>

<body>
<div id="chat-launcher">💬</div>
<div id="chat-wrapper" class="hidden">
    <!-- your chatbox HTML stays same -->
</div>
<div id="chat-wrapper">
    <div id="chat-header">
        ACOP Booking Assistant
        <span style="cursor:pointer;" onclick="location.reload()">✕</span>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-box">
        <input id="chat-input" placeholder="Type your message...">
        <button id="chat-send">Send</button>
    </div>
</div>

<script src="/static/chat-messenger.js"></script>

</body>
</html>
