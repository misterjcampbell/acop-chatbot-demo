<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACOP Assessment Booking</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Chat Toggle Button -->
    <button id="chat-toggle">Chat</button>

    <!-- Chat Popup -->
    <div id="chat-popup">
        <div id="chat-header">
            <span>ACOP Booking Assistant</span>
            <button id="close-chat">×</button>
        </div>
        <div id="chat-box">
            <div class="msg bot">Hi! I'm here to help you book your assessment call.<br>What's your name?</div>
        </div>
        <div id="chat-input">
            <input type="text" id="txt" placeholder="Type your message..." autocomplete="off">
            <button id="send">Send</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
