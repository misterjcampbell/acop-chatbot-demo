<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACOP Booking Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/chat-messenger.css">
</head>
<body>

<button id="chat-toggle" aria-label="Open chat">Chat</button>

<div id="chat-popup" aria-hidden="true" role="dialog" aria-label="ACOP chat">
  <div id="chat-window">
    <div id="chat-top">
      <div class="brand">
        <img src="/static/acop-logo-small.png" alt="ACOP" />
        <div class="brand-text">
          <div class="brand-title">ACOP Booking Assistant</div>
          <div class="brand-sub">Usually replies in seconds</div>
        </div>
      </div>
      <button id="close-chat" aria-label="Close chat">✕</button>
    </div>

    <div id="chat-box" aria-live="polite">
      <div class="msg bot">
        <div class="bubble">
          Hi! I'm here to help you book your assessment call.
          <div class="small">What's your name?</div>
        </div>
      </div>
    </div>

    <form id="chat-input" autocomplete="off" onsubmit="return false;">
      <input id="txt" type="text" placeholder="Type your message..." aria-label="Message input" />
      <button id="send" aria-label="Send">Send</button>
    </form>
  </div>
</div>

<script src="/static/chat-messenger.js" defer></script>
</body>
</html>
