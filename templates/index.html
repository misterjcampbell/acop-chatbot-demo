<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACOP Booking Assistant</title>

    <link rel="stylesheet" href="/static/chat-messenger.css?v=4">
</head>
<body>

    <!-- PAGE CONTENT -->
    <div style="height: 100vh; width: 100%;"></div>


    <!-- CORRECT SINGLE LAUNCHER -->
    <button id="chat-launcher" class="chat-launcher">
        💬
    </button>

    <!-- CORRECT SINGLE CHAT WIDGET -->
    <div id="chat-wrapper" class="chat-wrapper hidden">
        <div class="chat-header">
            <img src="/static/acop-logo.png" class="chat-logo">
            <span>ACOP Booking Assistant</span>
            <button id="chat-close" class="chat-close">✕</button>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-input-area">
            <input id="chat-input" type="text" placeholder="Type your message...">
            <button id="chat-send">Send</button>
        </div>
    </div>

<div class="calendar-wrapper">
  <div class="calendar-header">
    <button class="cal-prev">‹</button>
    <span class="cal-title">January 2026</span>
    <button class="cal-next">›</button>
  </div>

  <div class="calendar-grid">
    <!-- days injected here -->
  </div>
</div>
    <!-- JS -->
    <script src="/static/chat-messenger.js?v=4"></script>

    <script>
        // Close button functionality (you didn’t have this before)
        document.getElementById("chat-close").onclick = () => {
            document.getElementById("chat-wrapper").classList.add("hidden");
            document.getElementById("chat-launcher").style.display = "block";
        };
    </script>

</body>
</html>
