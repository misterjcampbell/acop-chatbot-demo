<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACOP Booking Assistant</title>

    <link rel="stylesheet" href="/static/chat-messenger.css?v=5">
    <style>
        /* CRITICAL: Override external CSS with !important for positioning */
        #chat-wrapper {
            position: fixed !important;
            bottom: 90px !important;
            right: 20px !important;
            left: auto !important;
            top: auto !important;
            width: 380px !important;
            max-width: calc(100vw - 40px) !important;
            max-height: 600px !important;
            background: white !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15) !important;
            display: flex !important;
            flex-direction: column !important;
            z-index: 9999 !important;
            transition: opacity 0.3s ease, transform 0.3s ease !important;
            transform: translateY(0) !important;
        }

        #chat-wrapper.hidden {
            opacity: 0 !important;
            transform: translateY(20px) scale(0.95) !important;
            pointer-events: none !important;
            display: flex !important; /* Keep flex even when hidden */
        }

        /* Chat Launcher Button */
        #chat-launcher {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            left: auto !important;
            top: auto !important;
            width: 60px !important;
            height: 60px !important;
            background: #004cbf !important;
            border: none !important;
            border-radius: 50% !important;
            font-size: 28px !important;
            cursor: pointer !important;
            box-shadow: 0 4px 12px rgba(0, 76, 191, 0.4) !important;
            transition: transform 0.2s, box-shadow 0.2s !important;
            z-index: 9998 !important;
        }

        #chat-launcher:hover {
            transform: scale(1.1) !important;
            box-shadow: 0 6px 16px rgba(0, 76, 191, 0.5) !important;
        }

        /* Chat Header */
        .chat-header {
            background: #004cbf !important;
            color: white !important;
            padding: 16px !important;
            border-radius: 12px 12px 0 0 !important;
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            flex-shrink: 0 !important;
        }

        .chat-logo {
            width: 32px !important;
            height: 32px !important;
            border-radius: 50% !important;
            background: white !important;
            object-fit: contain !important;
        }

        .chat-header span {
            flex: 1 !important;
            font-weight: 600 !important;
            font-size: 16px !important;
        }

        .chat-close {
            background: rgba(255, 255, 255, 0.2) !important;
            border: none !important;
            color: white !important;
            width: 32px !important;
            height: 32px !important;
            border-radius: 50% !important;
            cursor: pointer !important;
            font-size: 18px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: background 0.2s !important;
        }

        .chat-close:hover {
            background: rgba(255, 255, 255, 0.3) !important;
        }

        /* Chat Messages Area */
        .chat-messages {
            flex: 1 !important;
            overflow-y: auto !important;
            padding: 16px !important;
            background: #f8f9fa !important;
            min-height: 300px !important;
            max-height: 450px !important;
        }

        /* Chat Input Area */
        .chat-input-area {
            padding: 16px !important;
            background: white !important;
            border-top: 1px solid #e0e0e0 !important;
            display: flex !important;
            gap: 8px !important;
            border-radius: 0 0 12px 12px !important;
            flex-shrink: 0 !important;
        }

        #chat-input {
            flex: 1 !important;
            padding: 10px 14px !important;
            border: 1px solid #ddd !important;
            border-radius: 20px !important;
            outline: none !important;
            font-size: 14px !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        }

        #chat-input:focus {
            border-color: #004cbf !important;
        }

        #chat-send {
            background: #004cbf !important;
            color: white !important;
            border: none !important;
            padding: 10px 20px !important;
            border-radius: 20px !important;
            cursor: pointer !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            transition: background 0.2s !important;
        }

        #chat-send:hover {
            background: #003a8c !important;
        }

        #chat-send:disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
        }

        /* Messages */
        .message {
            margin-bottom: 12px !important;
            display: flex !important;
            animation: slideIn 0.3s ease !important;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            max-width: 80% !important;
            padding: 10px 14px !important;
            border-radius: 16px !important;
            font-size: 14px !important;
            line-height: 1.4 !important;
            word-wrap: break-word !important;
        }

        .bot-message {
            justify-content: flex-start !important;
        }

        .bot-message .message-content {
            background: white !important;
            color: #333 !important;
            border: 1px solid #e0e0e0 !important;
        }

        .user-message {
            justify-content: flex-end !important;
        }

        .user-message .message-content {
            background: #004cbf !important;
            color: white !important;
            margin-left: auto !important;
        }

        /* Button Container */
        .button-container {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 8px !important;
            margin-top: 10px !important;
        }

        .chat-button {
            background: white !important;
            border: 2px solid #004cbf !important;
            color: #004cbf !important;
            padding: 8px 16px !important;
            border-radius: 20px !important;
            cursor: pointer !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            transition: all 0.2s !important;
        }

        .chat-button:hover {
            background: #004cbf !important;
            color: white !important;
        }

        /* Verification Code Input Styles */
        .verification-input-wrapper {
            display: flex !important;
            gap: 8px !important;
            justify-content: center !important;
            margin: 15px 0 !important;
            padding: 10px !important;
        }

        .verification-input {
            width: 45px !important;
            height: 55px !important;
            font-size: 24px !important;
            font-weight: 600 !important;
            text-align: center !important;
            border: 2px solid #ddd !important;
            border-radius: 8px !important;
            outline: none !important;
            transition: all 0.2s ease !important;
            font-family: 'Courier New', monospace !important;
            background: white !important;
        }

        .verification-input:focus {
            border-color: #004cbf !important;
            box-shadow: 0 0 0 3px rgba(0, 76, 191, 0.1) !important;
            transform: scale(1.05) !important;
        }

        .verification-input.filled {
            background: #f0f7ff !important;
            border-color: #004cbf !important;
        }

        .verification-input.error {
            border-color: #dc3545 !important;
            background: #fff5f5 !important;
            animation: shake 0.3s ease !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Phone format hint */
        .format-hint {
            font-size: 12px !important;
            color: #666 !important;
            margin-top: 8px !important;
            padding: 8px !important;
            background: #f8f9fa !important;
            border-radius: 6px !important;
            border-left: 3px solid #004cbf !important;
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            #chat-wrapper {
                bottom: 0 !important;
                right: 0 !important;
                left: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                max-height: 100vh !important;
                border-radius: 0 !important;
            }

            .chat-header {
                border-radius: 0 !important;
            }

            .chat-messages {
                max-height: calc(100vh - 150px) !important;
            }

            .verification-input {
                width: 40px !important;
                height: 50px !important;
                font-size: 20px !important;
            }
        }
    </style>
</head>
<body>

    <!-- PAGE CONTENT -->
    <div style="height: 100vh; width: 100%;"></div>

    <!-- CHAT LAUNCHER -->
    <button id="chat-launcher" class="chat-launcher">
        💬
    </button>

    <!-- CHAT WIDGET -->
    <div id="chat-wrapper" class="hidden">
        <div class="chat-header">
            <img src="/static/acop-logo.png" class="chat-logo" alt="ACOP">
            <span>ACOP Booking Assistant</span>
            <button id="chat-close" class="chat-close">✕</button>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-input-area">
            <input id="chat-input" type="text" placeholder="Type your message...">
            <button id="chat-send">Send</button>
        </div>
    </div>

    <!-- JS -->
    <script src="/static/chat-messenger.js?v=5"></script>

    <script>
        // Enhanced chat functionality with verification code support
        (function() {
            const chatWrapper = document.getElementById("chat-wrapper");
            const chatMessages = document.getElementById("chat-messages");
            const chatInput = document.getElementById("chat-input");
            const chatSend = document.getElementById("chat-send");
            const chatLauncher = document.getElementById("chat-launcher");
            const chatClose = document.getElementById("chat-close");

            let sessionId = null;
            let verificationCodeInputActive = false;

            // Track conversation stage for UI enhancements
            function detectStage(botMessage) {
                const msg = botMessage.toLowerCase();
                
                if (msg.includes("verification code") && msg.includes("enter")) {
                    return "email_verify";
                } else if (msg.includes("email verified") || msg.includes("✓")) {
                    return "phone";
                } else if (msg.includes("phone number")) {
                    return "phone";
                } else if (msg.includes("which date")) {
                    return "date";
                } else if (msg.includes("available") && msg.includes("time")) {
                    return "time";
                }
                return null;
            }

            // Create verification code input
            function createVerificationInput() {
                const wrapper = document.createElement("div");
                wrapper.className = "verification-input-wrapper";
                wrapper.id = "verification-wrapper";

                for (let i = 0; i < 6; i++) {
                    const input = document.createElement("input");
                    input.type = "text";
                    input.maxLength = 1;
                    input.className = "verification-input";
                    input.dataset.index = i;
                    input.inputMode = "numeric";
                    input.pattern = "[0-9]";
                    
                    // Auto-focus next input
                    input.addEventListener("input", (e) => {
                        const value = e.target.value;
                        if (value.length === 1 && i < 5) {
                            const nextInput = wrapper.querySelector(`[data-index="${i + 1}"]`);
                            if (nextInput) nextInput.focus();
                        }
                        e.target.classList.add("filled");
                        
                        // Auto-submit when all 6 digits entered
                        checkAndSubmitCode(wrapper);
                    });

                    // Handle backspace
                    input.addEventListener("keydown", (e) => {
                        if (e.key === "Backspace" && !e.target.value && i > 0) {
                            const prevInput = wrapper.querySelector(`[data-index="${i - 1}"]`);
                            if (prevInput) {
                                prevInput.focus();
                                prevInput.value = "";
                                prevInput.classList.remove("filled");
                            }
                        }
                    });

                    // Only allow numbers
                    input.addEventListener("keypress", (e) => {
                        if (!/[0-9]/.test(e.key)) {
                            e.preventDefault();
                        }
                    });

                    wrapper.appendChild(input);
                }

                return wrapper;
            }

            // Check if all 6 digits entered and auto-submit
            function checkAndSubmitCode(wrapper) {
                const inputs = wrapper.querySelectorAll(".verification-input");
                const code = Array.from(inputs).map(input => input.value).join("");
                
                if (code.length === 6) {
                    // Wait a moment for visual feedback
                    setTimeout(() => {
                        sendMessage(code, false);
                    }, 300);
                }
            }

            // Show error on verification inputs
            function showVerificationError(wrapper) {
                const inputs = wrapper.querySelectorAll(".verification-input");
                inputs.forEach(input => {
                    input.classList.add("error");
                    setTimeout(() => {
                        input.classList.remove("error");
                        input.value = "";
                        input.classList.remove("filled");
                    }, 500);
                });
                // Focus first input
                inputs[0].focus();
            }

            // Add phone format hint
            function addPhoneFormatHint() {
                const hint = document.createElement("div");
                hint.className = "format-hint";
                hint.innerHTML = `
                    <strong>Accepted formats:</strong><br>
                    • Mobile: 0412 345 678<br>
                    • Landline: 02 9876 5432<br>
                    • International: +61 412 345 678
                `;
                return hint;
            }

            // Enhanced message display
            function displayBotMessage(text, buttons) {
                const msgDiv = document.createElement("div");
                msgDiv.className = "message bot-message";
                
                const contentDiv = document.createElement("div");
                contentDiv.className = "message-content";
                contentDiv.textContent = text;
                msgDiv.appendChild(contentDiv);

                chatMessages.appendChild(msgDiv);

                // Detect stage and add appropriate UI enhancements
                const stage = detectStage(text);
                
                if (stage === "email_verify") {
                    // Add verification code input
                    const verificationInput = createVerificationInput();
                    msgDiv.appendChild(verificationInput);
                    verificationCodeInputActive = true;
                    
                    // Hide regular input, focus first verification box
                    chatInput.style.display = "none";
                    chatSend.style.display = "none";
                    setTimeout(() => {
                        verificationInput.querySelector('[data-index="0"]').focus();
                    }, 100);
                    
                } else if (stage === "phone") {
                    // Re-enable regular input if it was disabled
                    chatInput.style.display = "block";
                    chatSend.style.display = "block";
                    verificationCodeInputActive = false;
                    
                    // Add phone format hint
                    const hint = addPhoneFormatHint();
                    msgDiv.appendChild(hint);
                    
                } else if (verificationCodeInputActive && text.includes("incorrect")) {
                    // Code was wrong - shake the inputs
                    const wrapper = document.getElementById("verification-wrapper");
                    if (wrapper) {
                        showVerificationError(wrapper);
                    }
                } else if (verificationCodeInputActive && (text.includes("verified") || text.includes("✓"))) {
                    // Code was correct - re-enable normal input
                    chatInput.style.display = "block";
                    chatSend.style.display = "block";
                    verificationCodeInputActive = false;
                }

                // Add buttons if provided
                if (buttons && buttons.length > 0) {
                    const btnContainer = document.createElement("div");
                    btnContainer.className = "button-container";
                    buttons.forEach(btn => {
                        const button = document.createElement("button");
                        button.className = "chat-button";
                        button.textContent = btn.label;
                        button.onclick = () => sendMessage(btn.value, true);
                        btnContainer.appendChild(button);
                    });
                    msgDiv.appendChild(btnContainer);
                }

                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function displayUserMessage(text) {
                const msgDiv = document.createElement("div");
                msgDiv.className = "message user-message";
                
                const contentDiv = document.createElement("div");
                contentDiv.className = "message-content";
                contentDiv.textContent = text;
                msgDiv.appendChild(contentDiv);

                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            async function sendMessage(message, fromButton = false) {
                if (!message.trim() && !fromButton) return;

                // Display user message (unless it's auto-submitted verification code)
                if (!verificationCodeInputActive || message.length !== 6) {
                    displayUserMessage(message);
                }
                
                chatInput.value = "";
                chatInput.disabled = true;
                chatSend.disabled = true;

                try {
                    const response = await fetch("/api/message", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: message,
                            session_id: sessionId,
                            from_button: fromButton
                        })
                    });

                    const data = await response.json();
                    sessionId = data.session_id;

                    displayBotMessage(data.reply, data.buttons || []);

                } catch (error) {
                    console.error("Error:", error);
                    displayBotMessage("Sorry, something went wrong. Please try again.");
                } finally {
                    chatInput.disabled = false;
                    chatSend.disabled = false;
                    if (!verificationCodeInputActive) {
                        chatInput.focus();
                    }
                }
            }

            // Event listeners
            chatSend.onclick = () => sendMessage(chatInput.value);
            chatInput.onkeypress = (e) => {
                if (e.key === "Enter") sendMessage(chatInput.value);
            };

            chatLauncher.onclick = () => {
                chatWrapper.classList.remove("hidden");
                chatLauncher.style.display = "none";
                
                // Send initial greeting if first time
                if (chatMessages.children.length === 0) {
                    displayBotMessage("Hi! I'm here to help you book an assessment call. What's your name?");
                }
                
                chatInput.focus();
            };

            chatClose.onclick = () => {
                chatWrapper.classList.add("hidden");
                chatLauncher.style.display = "block";
            };

        })();
    </script>

</body>
</html>
