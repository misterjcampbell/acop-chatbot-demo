<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACOP Chatbot</title>
<script>
async function sendMessage() {
    const msg = document.getElementById("msg").value;
    const res = await fetch("/api/message", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message: msg})
    });
    const data = await res.json();
    document.getElementById("chat").innerHTML += "<div>User: "+msg+"</div>";
    document.getElementById("chat").innerHTML += "<div>Bot: "+data.reply+"</div>";
    document.getElementById("msg").value = "";
}
</script>
</head>
<body>
<div id="chat" style="border:1px solid #ccc; padding:10px; height:300px; overflow:auto;"></div>
<input id="msg" type="text"><button onclick="sendMessage()">Send</button>
</body>
</html>
