<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACOP Assessment Booking</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Floating chat button (this was broken before) -->
    <div id="chat-launcher" onclick="toggleChat()">
        <span>Chat with us</span>
    </div>

    <!-- Chat widget (hidden at first) -->
    <div id="chat-widget" style="display:none;">
        <div id="chat-header">
            <span>ACOP Chatbot</span>
            <button onclick="toggleChat()" style="float:right;background:none;border:none;font-size:20px;cursor:pointer;">×</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        // Auto-open chat on load (optional – remove if you want click-only)
        window.onload = () => toggleChat();
    </script>
</body>
</html>
