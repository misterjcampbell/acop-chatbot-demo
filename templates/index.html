<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACOP Assessment Booking Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="acop-header">
    <img src="https://acop.edu.au/wp-content/uploads/2019/09/acop-logo.png" alt="ACOP" class="acop-logo">
    <div class="acop-title">Australian College of Professionals</div>
  </header>

  <!-- Floating chat button -->
  <button id="openChatBtn" aria-label="Open chat">Chat with us</button>

  <!-- Popup chat window -->
  <div id="chatPopup" aria-hidden="true">
    <div id="chatHeader">
      <div>ACOP Chatbot</div>
      <button id="closeChatBtn" aria-label="Close chat">✖</button>
    </div>

    <div id="chatMessages" role="log" aria-live="polite"></div>

    <div id="chatInputArea">
      <input id="userInput" type="text" placeholder="Type your message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
