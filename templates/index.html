<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Engagement Assessment Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #chat { border: 1px solid #ccc; padding: 20px; height: 400px; overflow-y: auto; }
        .user { color: blue; }
        .bot { color: green; }
        #input-area { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Engagement Assessment Chatbot</h1>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Type here..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        let step = 0;
        let formData = {};

        function appendMessage(sender, message) {
            const div = document.createElement('div');
            div.className = sender;
            div.textContent = message;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            appendMessage('user', text);
            input.value = '';

            if (step === 0) {
                formData.name = text;
                appendMessage('bot', "Great! What's your email?");
                step++;
            } else if (step === 1) {
                formData.email = text;
                appendMessage('bot', "Thanks! What's your phone number?");
                step++;
            } else if (step === 2) {
                formData.phone = text;
                appendMessage('bot', "When would you like to book your assessment? (YYYY-MM-DD)");
                step++;
            } else if (step === 3) {
                formData.date = text;
                appendMessage('bot', "At what time? (HH:MM)");
                step++;
            } else if (step === 4) {
                formData.time = text;
                appendMessage('bot', "Booking your assessment...");
                bookAssessment(formData);
                step++;
            }
        }

        async function bookAssessment(data) {
            try {
                const res = await fetch('/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                appendMessage('bot', result.message);
            } catch (err) {
                appendMessage('bot', "Server error. Please try again.");
            }
        }

        // Initial greeting
        appendMessage('bot', "Hi! I'm here to help you book your assessment call. What's your name?");
    </script>
</body>
</html>
