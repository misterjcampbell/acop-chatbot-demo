<!DOCTYPE html>
<html><head><title>ACOP Admin Login</title><style>
  body{font-family:Segoe UI;background:#f0f4f8;padding:50px;text-align:center}
  .box{max-width:400px;margin:0 auto;background:white;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
  input, button{padding:12px;margin:10px;width:100%;border-radius:8px;border:1px solid #ddd}
  button{background:#004cbf;color:white;font-weight:bold;cursor:pointer}
</style></head><body>
<div class="box">
  <h2>ACOP Admin Login</h2>
  <form method="POST">
    <input name="username" placeholder="Username" required><br>
    <input name="password" type="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>
</div>
</body></html>
