<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Admin Login - ACOP</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .card { background:white; padding:24px; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,0.12); width:360px; }
        input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:6px; }
        button { background:#0073c8; color:white; padding:10px 14px; border:none; border-radius:6px; cursor:pointer; width:100%; }
        .error { color: #b00020; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Admin Login</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/login">
            <label>Username</label>
            <input type="text" name="username" required autofocus value="{{ request.form.username or '' }}">
            <label>Password</label>
            <input type="password" name="password" required>
            <div style="margin-top:12px;">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
