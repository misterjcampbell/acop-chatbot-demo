<!doctype html>
<html>
<head><meta charset="utf-8"><title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4">
  <div class="container" style="max-width:420px">
    <h3>Admin Login</h3>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="alert alert-danger">{{messages[0]}}</div>{% endif %}
    {% endwith %}
    <form method="POST">
      <div class="mb-2"><label>Username</label><input name="username" class="form-control"></div>
      <div class="mb-2"><label>Password</label><input name="password" type="password" class="form-control"></div>
      <button class="btn btn-primary">Login</button>
    </form>
  </div>
</body>
</html>
