<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Settings • ACOP Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/admin.css" />
  <style>
    .save-success { display:none; padding:10px; border-radius:8px; background:#eafbea; color:#216c28; margin-bottom:12px; }
    .save-error { display:none; padding:10px; border-radius:8px; background:#fff0f0; color:#8b2b2b; margin-bottom:12px; }
  </style>
</head>
<body>
  <nav class="acop-topbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/admin"><img src="/static/acop-logo-small.png" class="brand-logo" alt="ACOP"> ACOP • Admin</a>
      <div class="ms-auto">
        <a href="/admin" class="btn btn-outline-primary btn-sm">Dashboard</a>
        <a href="/admin/logout" class="btn btn-danger btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container admin-container my-4">
    <h2>Admin Settings</h2>
    <p class="text-muted">Configure notifications and integrations.</p>

    <div id="saveSuccess" class="save-success">Settings saved successfully ✔</div>
    <div id="saveError" class="save-error">Failed to save settings. Please try again.</div>

    <form method="POST" id="settingsForm">
      <div class="mb-3">
        <label class="form-label">Send confirmation to client</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="email_per_booking" name="email_per_booking" {% if settings.email_per_booking %}checked{% endif %}>
          <label class="form-check-label" for="email_per_booking">Client confirmation emails</label>
        </div>
        <div class="form-text">When enabled a confirmation email is sent to clients after booking.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Attach CSV to admin email</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="attach_csv" name="attach_csv" {% if settings.attach_csv %}checked{% endif %}>
          <label class="form-check-label" for="attach_csv">Attach booking CSV</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Daily summary</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="daily_summary" name="daily_summary" {% if settings.daily_summary %}checked{% endif %}>
          <label class="form-check-label" for="daily_summary">Send daily summary email</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Weekly summary</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="weekly_summary" name="weekly_summary" {% if settings.weekly_summary %}checked{% endif %}>
          <label class="form-check-label" for="weekly_summary">Send weekly summary email</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Teams notifications</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="teams_enabled" name="teams_enabled" {% if settings.teams_enabled %}checked{% endif %}>
          <label class="form-check-label" for="teams_enabled">Enable Teams notifications</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Teams Webhook URL</label>
        <input class="form-control" type="text" name="teams_webhook" id="teams_webhook" value="{{ settings.teams_webhook }}" placeholder="https://outlook.office.com/webhook/..." />
        <div class="form-text">If Teams enabled, the webhook will be used to post booking alerts.</div>
      </div>

      <div class="text-end">
        <button type="submit" class="btn primary">Save settings</button>
      </div>
    </form>
  </main>

  <script>
    // show a success message after redirect if ?saved=1 in URL (Flask redirect could append it)
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('saved') === '1') {
        document.getElementById('saveSuccess').style.display = 'block';
        setTimeout(()=>{ document.getElementById('saveSuccess').style.display = 'none'; }, 3000);
      }
    });
  </script>
</body>
</html>
