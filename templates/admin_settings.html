<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Settings • ACOP Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin/admin.css">
  <style>
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; }
    .toast-success { background:#e7fbea; padding:10px 14px; border-left:4px solid #1f7a36; border-radius:8px; }
    .toast-error { background:#fff1f1; padding:10px 14px; border-left:4px solid #b10000; border-radius:8px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/admin">
        <img src="/static/acop-logo-small.png" alt="ACOP" style="height:30px;margin-right:8px"> ACOP • Admin
      </a>
      <div>
        <a class="btn btn-outline-primary btn-sm" href="/admin">Dashboard</a>
        <a class="btn btn-danger btn-sm" href="/admin/logout">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h3>Settings</h3>
    <p class="text-muted">Configure notifications and integrations.</p>

    <div id="toastArea" class="toast-container"></div>

    <form id="settingsForm" method="POST" action="/admin/settings">
      <div class="card p-4 shadow-sm mb-3">
        <h5>Email notifications</h5>
        <div class="form-check form-switch my-2">
          <input class="form-check-input" type="checkbox" id="email_per_booking" name="email_per_booking" {% if settings.email_per_booking %}checked{% endif %}>
          <label class="form-check-label" for="email_per_booking">Send confirmation email to client</label>
        </div>
        <div class="form-check form-switch my-2">
          <input class="form-check-input" type="checkbox" id="attach_csv" name="attach_csv" {% if settings.attach_csv %}checked{% endif %}>
          <label class="form-check-label" for="attach_csv">Attach CSV to admin emails</label>
        </div>
        <div class="form-check form-switch my-2">
          <input class="form-check-input" type="checkbox" id="daily_summary" name="daily_summary" {% if settings.daily_summary %}checked{% endif %}>
          <label class="form-check-label" for="daily_summary">Daily summary email</label>
        </div>
        <div class="form-check form-switch my-2">
          <input class="form-check-input" type="checkbox" id="weekly_summary" name="weekly_summary" {% if settings.weekly_summary %}checked{% endif %}>
          <label class="form-check-label" for="weekly_summary">Weekly summary email</label>
        </div>
      </div>

      <div class="card p-4 shadow-sm mb-3">
        <h5>Microsoft Teams</h5>
        <div class="form-check form-switch my-2">
          <input class="form-check-input" type="checkbox" id="teams_enabled" name="teams_enabled" {% if settings.teams_enabled %}checked{% endif %}>
          <label class="form-check-label" for="teams_enabled">Enable Teams notifications</label>
        </div>
        <div class="mb-2">
          <label class="form-label">Teams Webhook URL</label>
          <input class="form-control" type="text" id="teams_webhook" name="teams_webhook" value="{{ settings.teams_webhook }}">
          <div class="form-text">If Teams enabled, the webhook will be used to post booking alerts.</div>
        </div>
        <div class="mt-3 text-end">
          <button id="saveBtn" class="btn btn-primary">Save settings</button>
          <button id="testTeams" type="button" class="btn btn-outline-info ms-2">Send test Teams</button>
          <hr>

          <h3>Test Email</h3>
          <button type="button" id="testEmailBtn" class="btn btn-secondary">
              Send Test Email
          </button>

          <p id="testEmailResult" style="margin-top: 6px; font-weight: bold;"></p>

        </div>
      </div>
    </form>
  </div>

  <script>
    function toast(msg, type='success') {
      const area = document.getElementById('toastArea');
      const el = document.createElement('div');
      el.className = type === 'success' ? 'toast-success' : 'toast-error';
      el.textContent = msg;
      area.appendChild(el);
      setTimeout(()=>el.remove(), 3000);
    }

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = document.getElementById('settingsForm');
      const fd = new FormData(form); // works with Flask request.form

      try {
        const res = await fetch('/admin/settings', { method: 'POST', body: fd });
        if (res.ok) {
          toast('Settings saved ✔', 'success');
        } else {
          toast('Save failed', 'error');
        }
      } catch (err) {
        console.error(err);
        toast('Network error', 'error');
      }
    });

    document.getElementById('testTeams').addEventListener('click', async () => {
      try {
        const res = await fetch('/admin/test-teams');
        const text = await res.text();
        toast(`Teams test: ${text}`, text === 'OK' ? 'success' : 'error');
      } catch (err) {
        toast('Teams test failed', 'error');
      }
    });
  </script>
</body>
</html>
