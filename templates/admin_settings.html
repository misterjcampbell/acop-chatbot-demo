<!doctype html>
<html>
<head><meta charset="utf-8"><title>Settings</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4">
  <div class="container" style="max-width:900px">
    <h3>Settings</h3>
    <form method="POST">
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="email_per_booking" id="email_per_booking" {% if settings.email_per_booking %}checked{% endif %}><label class="form-check-label" for="email_per_booking">Email per booking</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="attach_csv" id="attach_csv" {% if settings.attach_csv %}checked{% endif %}><label class="form-check-label" for="attach_csv">Attach CSV</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="teams_enabled" id="teams_enabled" {% if settings.teams_enabled %}checked{% endif %}><label class="form-check-label" for="teams_enabled">Teams enabled</label></div>
      <div class="mb-2"><label>Teams webhook</label><input class="form-control" name="teams_webhook" value="{{settings.teams_webhook}}"></div>
      <button class="btn btn-primary">Save</button>
      <a href="/admin" class="btn btn-secondary">Back</a>
    </form>
  </div>
</body>
</html>
