<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Settings • ACOP Booking</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin.css">

  <style>
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2000;
    }
    .toast-success {
      background: #e7fbea;
      border-left: 5px solid #1f7a36;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      color: #1f7a36;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .toast-error {
      background: #fff1f1;
      border-left: 5px solid #b10000;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      color: #b10000;
      font-weight: 500;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <nav class="acop-topbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/admin">
        <img src="/static/acop-logo-small.png" class="brand-logo" alt="ACOP">
        ACOP • Admin
      </a>
      <div class="ms-auto">
        <a href="/admin" class="btn btn-outline-primary btn-sm">Dashboard</a>
        <a href="/admin/logout" class="btn btn-danger btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <main class="container admin-container my-4">
    <h2>Admin Settings</h2>
    <p class="text-muted">Configure notifications and system behaviour.</p>

    <form id="settingsForm">
      <div class="card p-4 shadow-sm">

        <h5>Email Notifications</h5>
        <hr>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="email_per_booking" name="email_per_booking"
                 {% if settings.email_per_booking %}checked{% endif %}>
          <label class="form-check-label" for="email_per_booking">Send confirmation email to client</label>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="attach_csv" name="attach_csv"
                 {% if settings.attach_csv %}checked{% endif %}>
          <label class="form-check-label" for="attach_csv">Attach CSV to admin emails</label>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="daily_summary" name="daily_summary"
                 {% if settings.daily_summary %}checked{% endif %}>
          <label class="form-check-label" for="daily_summary">Daily summary email</label>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="weekly_summary" name="weekly_summary"
                 {% if settings.weekly_summary %}checked{% endif %}>
          <label class="form-check-label" for="weekly_summary">Weekly summary email</label>
        </div>

        <h5 class="mt-4">Microsoft Teams</h5>
        <hr>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="teams_enabled" name="teams_enabled"
                 {% if settings.teams_enabled %}checked{% endif %}>
          <label class="form-check-label" for="teams_enabled">Enable Teams notifications</label>
        </div>

        <div class="mb-3">
          <label class="form-label">Teams Webhook URL</label>
          <input type="text" class="form-control" id="teams_webhook" name="teams_webhook"
                 value="{{ settings.teams_webhook }}">
        </div>

        <div class="text-end mt-4">
          <button type="submit" class="btn btn-primary px-4 py-2">Save Settings</button>
        </div>

      </div>
    </form>

  </main>

<script>
  const toastContainer = document.getElementById("toastContainer");

  function showToast(message, type = "success") {
    const div = document.createElement("div");
    div.className = type === "success" ? "toast-success" : "toast-error";
    div.textContent = message;
    toastContainer.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  document.getElementById("settingsForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
      email_per_booking: document.getElementById("email_per_booking").checked,
      attach_csv: document.getElementById("attach_csv").checked,
      daily_summary: document.getElementById("daily_summary").checked,
      weekly_summary: document.getElementById("weekly_summary").checked,
      teams_enabled: document.getElementById("teams_enabled").checked,
      teams_webhook: document.getElementById("teams_webhook").value.trim()
    };

    try {
      const res = await fetch("/admin/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.success) {
        showToast("Settings saved ✔", "success");
      } else {
        showToast("Failed to save settings", "error");
      }

    } catch (err) {
      console.error(err);
      showToast("Network or server error", "error");
    }
  });
</script>

</body>
</html>
