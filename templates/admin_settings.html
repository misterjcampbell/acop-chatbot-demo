<!DOCTYPE html>
<html>
<head><title>ACOP Settings</title>
<style>
    body {font-family:Segoe UI,sans-serif;margin:40px;background:#f8f9fa}
    h1 {color:#004cbf}
    label {display:block;margin:15px 0 5px;font-weight:bold}
    input, textarea {width:100%;max-width:500px;padding:10px;font-size:16px}
    button {background:#0098ea;color:white;padding:12px 30px;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin-top:20px}
    .back {margin-top:30px}
</style>
</head>
<body>
<h1>Notification Settings</h1>
<form method="POST">
    <label><input type="checkbox" name="email_per_booking" {{ 'checked' if email_per_booking }}> Send confirmation email to student</label>
    <label><input type="checkbox" name="attach_csv" {{ 'checked' if attach_csv }}> Attach CSV to admin email</label>
    <label><input type="checkbox" name="teams_enabled" {{ 'checked' if teams_enabled }}> Send alert to Microsoft Teams</label>
    <label>Teams Webhook URL (only if above is ticked)<br>
        <input type="text" name="teams_webhook" value="{{ teams_webhook }}" placeholder="https://...">
    </label>
    <button type="submit">Save Settings</button>
</form>
<p class="back"><a href="/admin">← Back to bookings</a></p>
</body>
</html>
