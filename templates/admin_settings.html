<!DOCTYPE html>
<html>
<head>
    <title>Admin Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4">Admin Settings</h2>

    <form method="POST">

        <!-- Email Per Booking -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox"
                   name="email_per_booking"
                   id="email_per_booking"
                   {% if settings.email_per_booking %}checked{% endif %}>
            <label class="form-check-label" for="email_per_booking">
                Email me for every new booking
            </label>
        </div>

        <!-- Attach CSV -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox"
                   name="attach_csv"
                   id="attach_csv"
                   {% if settings.attach_csv %}checked{% endif %}>
            <label class="form-check-label" for="attach_csv">
                Attach booking CSV to notification email
            </label>
        </div>

        <!-- Teams Enabled -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox"
                   name="teams_enabled"
                   id="teams_enabled"
                   {% if settings.teams_enabled %}checked{% endif %}>
            <label class="form-check-label" for="teams_enabled">
                Enable Teams notifications
            </label>
        </div>

        <!-- Teams Webhook -->
        <div class="mb-3">
            <label for="teams_webhook" class="form-label">Teams Webhook URL</label>
            <input type="text" class="form-control"
                   name="teams_webhook"
                   id="teams_webhook"
                   value="{{ settings.teams_webhook }}">
        </div>

        <button class="btn btn-primary">Save Settings</button>
        <a href="/admin" class="btn btn-secondary">Back</a>

    </form>
</div>

</body>
</html>
