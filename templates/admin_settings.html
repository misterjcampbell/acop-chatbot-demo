<!DOCTYPE html>
<html>
<head>
  <title>Settings - ACOP</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    label { display: block; margin: 10px 0; }
  </style>
</head>
<body>

<h2>Admin Settings</h2>
<a href="/admin">← Back</a>

{% with messages=get_flashed_messages() %}
  {% if messages %}
    <p style="color:green;">{{ messages[0] }}</p>
  {% endif %}
{% endwith %}

<form method="POST">

  <label>
      <input type="checkbox" name="email_per_booking"
          {% if settings.email_per_booking %}checked{% endif %}>
      Email admin per booking
  </label>

  <label>
      <input type="checkbox" name="attach_csv"
          {% if settings.attach_csv %}checked{% endif %}>
      Attach CSV file
  </label>

  <label>
      <input type="checkbox" name="teams_enabled"
          {% if settings.teams_enabled %}checked{% endif %}>
      Enable Teams notifications
  </label>

  <label>
      Teams Webhook:
      <input type="text" name="teams_webhook" value="{{ settings.teams_webhook }}" style="width:100%;">
  </label>

  <button>Save Settings</button>
</form>

</body>
</html>
