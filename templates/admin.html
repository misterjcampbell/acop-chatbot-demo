<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - ACOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/admin.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>
<body>

<div class="topbar">
  <h3>Admin Dashboard</h3>
  <div>
    <a class="acop-ghost" href="/admin/settings">Settings</a>
    <a class="acop-btn" href="/admin/export">Export CSV</a>
    <a class="acop-ghost" href="/admin/logout">Logout</a>
  </div>
</div>

<div class="calendar-container">
  <div class="calendar-header">
    <button id="prevBtn" class="cal-nav">‹</button>
    <div id="calendarTitle">Loading…</div>
    <button id="nextBtn" class="cal-nav">›</button>
  </div>
  <div class="control-row">
    <button id="blockBtn" class="btn btn-danger">Block Date</button>
    <button id="unblockBtn" class="btn btn-success">Unblock Date</button>
    <button id="blockRangeBtn" class="btn btn-danger">Block Range</button>
    <button id="unblockRangeBtn" class="btn btn-success">Unblock Range</button>
  </div>

  <div id="calendar"></div>
</div>
<h4 class="mt-4">Bookings</h4>
 <div class="table-responsive">
   <table class="table table-sm">
     <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Date</th><th>Time</th><th>Actions</th></tr></thead>
     <tbody>
       {% for b in bookings %}
       <tr>
         <td>{{ b[0] }}</td>
         <td>{{ b[1] }}</td>
         <td>{{ b[2] }}</td>
         <td>{{ b[3] }}</td>
         <td>{{ b[4] }}</td>
         <td>{{ b[5] }}</td>
         <td>
           <form method="POST" action="/admin/delete-booking/{{ b[0] }}" onsubmit="return confirm('Delete booking?')">
             <button class="btn btn-sm btn-danger">Delete</button>
           </form>
         </td>
       </tr>
       {% else %}
       <tr><td colspan="7" class="text-center text-muted">No bookings yet.</td></tr>
       {% endfor %}
     </tbody>
   </table>
 </div>
<script src="/static/admin.js"></script>

</body>
</html>
