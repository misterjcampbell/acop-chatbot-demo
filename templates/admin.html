<!DOCTYPE html>
<html>
<head>
    <title>Admin – ACOP Bookings</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ccc; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>

<h1>All Bookings</h1>

<table>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Date</th>
        <th>Time</th>
    </tr>

    {% for b in bookings %}
    <tr>
        <td>{{ b[0] }}</td>
        <td>{{ b[1] }}</td>
        <td>{{ b[2] }}</td>
        <td>{{ b[3] }}</td>
        <td>{{ b[4] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
