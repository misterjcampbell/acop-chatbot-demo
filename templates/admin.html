<!DOCTYPE html>
<html>
<head>
    <title>Admin - ACOP</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        .blocked { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h2>Admin Panel</h2>
<a href="/admin/logout">Logout</a>

<h3>Blocked Dates</h3>

<ul>
    {% for d in blocked_dates %}
        <li class="blocked">{{ d }}
            <form action="/admin/unblock" method="POST" style="display:inline;">
                <input type="hidden" name="date" value="{{ d }}">
                <button>Unblock</button>
            </form>
        </li>
    {% endfor %}
</ul>

<form action="/admin/block" method="POST">
    <input type="date" name="date">
    <button>Block Date</button>
</form>

<h3>Bookings</h3>
<table>
    <tr><th>Name</th><th>Email</th><th>Phone</th><th>Date</th><th>Time</th></tr>
    {% for b in bookings %}
        <tr>
            <td>{{ b[1] }}</td>
            <td>{{ b[2] }}</td>
            <td>{{ b[3] }}</td>
            <td>{{ b[4] }}</td>
            <td>{{ b[5] }}</td>
        </tr>
    {% endfor %}
</table>

</body>
</html>
