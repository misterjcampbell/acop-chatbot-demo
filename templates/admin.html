<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

    <style>
        body { background:#f8f9fa; }
        .calendar-container { background:white; padding:20px; border-radius:12px; }
    </style>
</head>

<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Dashboard</h2>
        <div>
            <a href="/admin/settings" class="btn btn-secondary">Settings</a>
            <a href="/admin/export" class="btn btn-info text-white">Export CSV</a>
            <a href="/admin/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <!-- CALENDAR -->
    <div class="calendar-container mb-4">
        <div id="calendar"></div>
    </div>

    <!-- BOOKINGS TABLE -->
    <h4 class="mb-3">All Bookings</h4>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
            <th>Date</th><th>Time</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        {% for b in bookings %}
            <tr>
                <td>{{ b[0] }}</td>
                <td>{{ b[1] }}</td>
                <td>{{ b[2] }}</td>
                <td>{{ b[3] }}</td>
                <td>{{ b[4] }}</td>
                <td>{{ b[5] }}</td>
                <td>
                    <form action="/admin/delete/{{ b[0] }}" method="POST" onsubmit="return confirm('Delete booking?')">
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const calendarEl = document.getElementById("calendar");

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        events: [
            {% for b in bookings %}
            {
                title: "{{ b[1]|e }} — {{ b[5] }}",
                start: "{{ b[4] }}",
                color: "#0098ea"
            },
            {% endfor %}
        ]
    });

    calendar.render();
});
</script>

</body>
</html>
