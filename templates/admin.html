<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - ACOP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin/admin.css">
  <style>.fc { max-width:1100px; margin: 0 auto; }</style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Admin Dashboard</h3>
      <div>
        <a class="btn btn-outline-primary btn-sm" href="/admin/export">Export CSV</a>
        <a class="btn btn-outline-secondary btn-sm" href="/admin/settings">Settings</a>
        <a class="btn btn-danger btn-sm" href="/admin/logout">Logout</a>
      </div>
    </div>

    <div class="mb-3 d-flex gap-2">
      <button id="blockRangeBtn" class="btn btn-primary btn-sm">Block Selected Range</button>
      <button id="unblockRangeBtn" class="btn btn-outline-secondary btn-sm">Unblock Selected Range</button>
      <button id="blockBtn" class="btn btn-outline-success btn-sm">Block Selected Day</button>
      <button id="unblockBtn" class="btn btn-outline-warning btn-sm">Unblock Selected Day</button>
      <button id="refreshBtn" class="btn btn-light btn-sm">Refresh</button>
    </div>

    <div id="calendar" class="fc"></div>

    <h4 class="mt-4">Bookings</h4>
    <div class="table-responsive">
      <table class="table table-sm">
        <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Date</th><th>Time</th><th>Actions</th></tr></thead>
        <tbody>
          {% for b in bookings %}
          <tr>
            <td>{{ b[0] }}</td>
            <td>{{ b[1] }}</td>
            <td>{{ b[2] }}</td>
            <td>{{ b[3] }}</td>
            <td>{{ b[4] }}</td>
            <td>{{ b[5] }}</td>
            <td>
              <form method="POST" action="/admin/delete-booking/{{ b[0] }}" onsubmit="return confirm('Delete booking?')">
                <button class="btn btn-sm btn-danger">Delete</button>
              </form>
            </td>
          </tr>
          {% else %}
          <tr><td colspan="7" class="text-center text-muted">No bookings yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="/static/admin/admin.js" defer></script>
</body>
</html>
