<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - ACOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <style>
    body{font-family:Segoe UI,Arial;background:#f4f7fb;padding:18px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .fc{max-width:980px;margin:0 auto;background:#fff;padding:14px;border-radius:10px;box-shadow:0 6px 18px rgba(3,12,34,0.06)}
    .fc .fc-daygrid-day.fc-day-blocked{background:#ffecec}
    .fc .fc-daygrid-day.fc-day-has-booking{background:#dff3ff}
    .controls{max-width:980px;margin:12px auto;display:flex;gap:8px;align-items:center}
    .acop-btn { background:#004cbf;color:#fff;border-radius:6px;padding:8px 12px;border:none }
    .acop-ghost { background:#fff;border:1px solid #004cbf;color:#004cbf;padding:8px 12px;border-radius:6px }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h3>Admin Dashboard</h3>
      <div>
        <a class="acop-ghost" href="/admin/settings">Settings</a>
        <a class="acop-btn" href="/admin/export">Export CSV</a>
        <a class="acop-ghost" href="/admin/logout">Logout</a>
      </div>
    </div>

    <div class="controls">
      <button id="block-mode" class="btn btn-outline-primary">Block Selected Range</button>
      <button id="unblock-mode" class="btn btn-outline-secondary">Unblock Selected Range</button>
      <small class="text-muted">Click a day to toggle block; drag-select a range to (un)block.</small>
    </div>

    <div id="calendar" class="fc"></div>

    <h4 class="mt-4">Bookings</h4>
    <table class="table table-sm">
      <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Date</th><th>Time</th><th>Actions</th></tr></thead>
      <tbody>
        {% for b in bookings %}
        <tr>
          <td>{{ b[0] }}</td><td>{{ b[1] }}</td><td>{{ b[2] }}</td><td>{{ b[3] }}</td><td>{{ b[4] }}</td><td>{{ b[5] }}</td>
          <td>
            <form method="POST" action="/admin/delete-booking/{{ b[0] }}" onsubmit="return confirm('Delete booking?')">
              <button class="btn btn-sm btn-danger">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    const calendarEl = document.getElementById('calendar');
    const blockBtn = document.getElementById('block-mode');
    const unblockBtn = document.getElementById('unblock-mode');
    let currentAction = 'block';

    blockBtn.onclick = ()=>{ currentAction='block'; blockBtn.classList.add('btn-primary'); unblockBtn.classList.remove('btn-primary'); };
    unblockBtn.onclick = ()=>{ currentAction='unblock'; unblockBtn.classList.add('btn-primary'); blockBtn.classList.remove('btn-primary'); };

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      selectable: true,
      height: 'auto',
      select: async function(info){
        // FullCalendar provides end exclusive; we use the ISO dates as given
        const start = info.startStr.split('T')[0];
        const end = info.endStr.split('T')[0]; // end may be next day — backend handles inclusive
        const res = await fetch('/admin/toggle-range', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({start:start, end:end, action: currentAction})
        });
        if(res.ok) calendar.refetchEvents();
      },
      dateClick: async function(info){
        const date = info.dateStr;
        const res = await fetch('/admin/toggle-date', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({date})
        });
        if(res.ok) calendar.refetchEvents();
      },
      events: '/admin/events'
    });

    calendar.render();
  });
  </script>
</body>
</html>
