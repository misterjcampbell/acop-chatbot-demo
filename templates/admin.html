<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Admin - ACOP Bookings</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .logout { background:#c0392b; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
        .delete-btn { background:#e74c3c; color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>All Bookings</h1>
        <div><a href="/admin/export">
    <button class="logout" style="background:#27ae60;">Download CSV</button>
</a>
            <span>Signed in as <strong>{{ admin_user }}</strong></span>
            <a href="/admin/logout"><button class="logout">Logout</button></a>
        </div>
    </div>

    <table>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Date</th>
            <th>Time</th>
            <th>Action</th>
        </tr>
        {% for b in bookings %}
        <tr>
            <td>{{ b[0] }}</td>
            <td>{{ b[1] }}</td>
            <td>{{ b[2] }}</td>
            <td>{{ b[3] }}</td>
            <td>{{ b[4] }}</td>
            <td>{{ b[5] }}</td>
            <td>
                <form method="post" action="/admin/delete/{{ b[0] }}" style="display:inline;" onsubmit="return confirm('Delete booking?');">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
