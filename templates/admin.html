<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - ACOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <style>
    body{padding:20px;font-family:Segoe UI,Arial}
    .fc{max-width:780px;margin:0 auto}
    .fc-daygrid-day.fc-day-blocked{background:#ffd8d8}
    .fc-daygrid-day.fc-day-has-booking{background:#d6f0ff}
    .controls{max-width:780px;margin:10px auto 20px;display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Admin Dashboard</h3>
      <div>
        <a class="btn btn-secondary" href="/admin/settings">Settings</a>
        <a class="btn btn-info text-white" href="/admin/export">Export CSV</a>
        <a class="btn btn-danger" href="/admin/logout">Logout</a>
      </div>
    </div>

    <div class="controls">
      <button id="block-mode" class="btn btn-outline-primary">Block Selected Range</button>
      <button id="unblock-mode" class="btn btn-outline-secondary">Unblock Selected Range</button>
      <small class="text-muted">Click a day to toggle block; drag select a range to (un)block.</small>
    </div>

    <div id="calendar"></div>

    <h4 class="mt-4">Bookings</h4>
    <table class="table table-sm table-bordered">
      <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Date</th><th>Time</th><th>Action</th></tr></thead>
      <tbody>
        {% for b in bookings %}
        <tr>
          <td>{{b[0]}}</td><td>{{b[1]}}</td><td>{{b[2]}}</td><td>{{b[3]}}</td><td>{{b[4]}}</td><td>{{b[5]}}</td>
          <td>
            <form method="POST" action="/admin/delete-booking/{{b[0]}}" onsubmit="return confirm('Delete booking?')">
              <button class="btn btn-sm btn-danger">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    const calendarEl = document.getElementById('calendar');
    const blockBtn = document.getElementById('block-mode');
    const unblockBtn = document.getElementById('unblock-mode');
    let currentAction = 'block';

    blockBtn.onclick = ()=> { currentAction='block'; blockBtn.classList.add('btn-primary'); blockBtn.classList.remove('btn-outline-primary'); unblockBtn.classList.remove('btn-primary'); unblockBtn.classList.add('btn-outline-secondary'); };
    unblockBtn.onclick = ()=> { currentAction='unblock'; unblockBtn.classList.add('btn-primary'); unblockBtn.classList.remove('btn-outline-secondary'); blockBtn.classList.remove('btn-primary'); blockBtn.classList.add('btn-outline-primary'); };

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      selectable: true,
      height: 'auto',
      select: async function(selectionInfo){
        const start = selectionInfo.startStr.split('T')[0];
        const end = selectionInfo.endStr.split('T')[0];
        const resp = await fetch('/admin/toggle-range', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({start: start, end: (new Date(selectionInfo.end)).toISOString().split('T')[0], action: currentAction})
        });
        if(resp.ok) calendar.refetchEvents();
      },
      dateClick: async function(info){
        // toggle single date
        const date = info.dateStr;
        const res = await fetch('/admin/toggle-date', {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date})
        });
        if(res.ok) calendar.refetchEvents();
      },
      events: '/admin/events',
      dayCellDidMount: function(arg){
        // additional per-day styling handled via events (blocked/booked)
      }
    });

    calendar.render();
  });
  </script>
</body>
</html>
