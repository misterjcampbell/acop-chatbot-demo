services:
  - type: web
    name: acop-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acop-db
          property: connectionString
  - type: pgsql
    name: acop-db
    plan: free  # 90-day trial, then $7/mo
